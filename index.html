<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bharti Tech Care Gaming</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d1d;color:white;font-family:Arial,sans-serif}
header{padding:22px 14px;text-align:center;background:linear-gradient(120deg,#24105c,#075985)}
h1{color:#42f5ff;margin:5px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}
button{border:0;border-radius:10px;padding:12px;background:#16d9ed;color:#07111f;font-weight:bold;cursor:pointer}
main{max-width:950px;margin:auto;padding:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.card{background:#171f38;padding:18px 8px;text-align:center;border:1px solid #344365;border-radius:16px;cursor:pointer}
.emoji{font-size:40px}
#play{display:none;background:#171f38;padding:18px;margin-top:18px;border-radius:16px;text-align:center}
#board{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:18px auto}
.cell{min-width:42px;min-height:42px;padding:12px;background:#344365;color:white;border-radius:8px}
#message{color:#42f5ff;min-height:25px}
footer{text-align:center;padding:25px;color:#aab7d5}
</style>
</head>
<body>
<header>
<h1>BHARTI TECH CARE</h1>
<p>🎮 GAMING WORLD</p>
<p>अपना गेम चुनो और खेलना शुरू करो!</p>
</header>
<nav>
<button onclick="showAll()">🏠 Home</button>
<button onclick="showAll()">🎯 All Games</button>
</nav>
<main>
<h2>🔥 Popular Games</h2>
<div class="cards" id="games"></div>
<section id="play">
<h2 id="gameTitle"></h2>
<p id="instructions"></p>
<p>स्कोर: <b id="score">0</b></p>
<div id="board"></div>
<p id="message">गेम शुरू करो!</p>
<button onclick="startGame()">🔄 Restart</button>
<button onclick="showAll()">🏠 वापस जाएँ</button>
</section>
</main>
<footer>© Bharti Tech Care Gaming</footer>
<script>
const list=[
["🔢","Number Puzzle","number"],
["🧩","Arrow Puzzle","arrow"],
["🫧","Bubble Puzzle","bubble"],
["⚽","Ball Puzzle","ball"],
["🏃","Running Game","run"],
["🐍","Snake Game","snake"],
["🏎️","Car Racing","car"],
["🐔","Chicken Road","chicken"],
["⭕","Tic Tac Toe","tic"]
];
const games=document.getElementById("games");
list.forEach(g=>{
let d=document.createElement("div");d.className="card";
d.innerHTML='<div class="emoji">'+g[0]+'</div><b>'+g[1]+'</b><p>▶ Play Now</p>';
d.onclick=()=>openGame(g[1],g[2]);games.appendChild(d);
});
let mode="number",score=0,answer=0,turn=0,over=false;
function showAll(){
document.getElementById("play").style.display="none";
games.parentElement.style.display="grid";
}
function openGame(title,m){
mode=m;document.getElementById("gameTitle").textContent=title;
document.getElementById("play").style.display="block";
games.parentElement.style.display="grid";
startGame();
document.getElementById("play").scrollIntoView({behavior:"smooth"});
}
function startGame(){
score=0;turn=0;over=false;updateScore();
let b=document.getElementById("board");b.innerHTML="";
let msg=document.getElementById("message");
const ins={
number:"1 से 10 में छिपा नंबर चुनो।",
arrow:"सही दिशा वाला तीर चुनो।",
bubble:"एक जैसे रंग के बबल चुनो।",
ball:"गेंद को गोल में पहुँचाओ।",
run:"बाधा आने पर JUMP दबाओ।",
snake:"नंबर दबाकर साँप को खाना खिलाओ।",
car:"कार को सुरक्षित लेन में चलाओ।",
chicken:"सड़क पार करो और गाड़ियों से बचो।",
tic:"तीन निशान एक लाइन में लगाओ।"
};
document.getElementById("instructions").textContent=ins[mode]||"खेलो और स्कोर बनाओ!";
msg.textContent="शुभकामनाएँ!";
if(mode==="number"){answer=1+Math.floor(Math.random()*10);for(let i=1;i<=10;i++)add(i,()=>{if(i===answer){score+=10;msg.textContent="🎉 सही जवाब! +10";answer=1+Math.floor(Math.random()*10)}else msg.textContent="फिर कोशिश करो!";updateScore()})}
else if(mode==="arrow"){let dirs=["⬆️","⬇️","⬅️","➡️"];answer=dirs[Math.floor(Math.random()*4)];msg.textContent="यह दिशा चुनो: "+answer;dirs.sort(()=>Math.random()-.5).forEach(x=>add(x,()=>{if(x===answer){score+=10;msg.textContent="सही!";answer=dirs[Math.floor(Math.random()*4)];msg.textContent+=" अगला: "+answer}else msg.textContent="गलत दिशा!";updateScore()}))}
else if(mode==="bubble"||mode==="ball"){let colors=["🔵","🟡","🔴","🟢"];answer=colors[Math.floor(Math.random()*4)];msg.textContent="यह चुनो: "+answer;for(let i=0;i<12;i++){let x=colors[Math.floor(Math.random()*4)];add(x,()=>{if(x===answer){score+=5;msg.textContent="अच्छा निशाना! +5"}else msg.textContent="दूसरा रंग चुनो";updateScore()})}}
else if(mode==="tic"){let vals=Array(9).fill("");let player="X";for(let i=0;i<9;i++)add("⬜",function(){if(vals[i]||over)return;vals[i]=player;this.textContent=player;if(vals[i]&&[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>a.every(j=>vals[j]===player))){msg.textContent=player+" जीता!";score+=10;over=true;updateScore();return}if(vals.every(Boolean)){msg.textContent="मैच ड्रॉ!";over=true;return}player=player==="X"?"O":"X";if(player==="O"){let empty=vals.map((v,j)=>v? -1:j).filter(j=>j>=0);let j=empty[Math.floor(Math.random()*empty.length)];vals[j]="O";b.children[j].textContent="O";if([[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>a.every(k=>vals[k]==="O"))){msg.textContent="कंप्यूटर जीता!";over=true}else player="X"}})}
else if(mode==="run"||mode==="car"||mode==="chicken"){msg.textContent="हर सही चाल पर 1 अंक। टक्कर से बचो!";let lane=1;function draw(){b.innerHTML="";["⬅️","⬆️","➡️"].forEach((x,i)=>add(x,()=>{if(over)return;lane=i;turn++;if(Math.random()<.22){msg.textContent="💥 टक्कर! गेम ओवर";over=true}else{score++;msg.textContent="सुरक्षित! अगली चाल चलो";updateScore();draw()}}));add(mode==="run"?"🏃":mode==="car"?"🏎️":"🐔",()=>{if(over)return;score++;turn++;updateScore();msg.textContent="बढ़िया! आगे बढ़ो";if(turn>=15){msg.textContent="🏆 लेवल पूरा!";over=true}else draw()})}draw()}
else if(mode==="snake"){msg.textContent="खाना पकड़ने के लिए सही नंबर चुनो";for(let i=1;i<=9;i++)add(i,()=>{score+=Math.floor(Math.random()*5)+1;msg.textContent="🐍 साँप ने खाना खाया!";updateScore()})}
function add(label,fn){let e=document.createElement("button");e.className="cell";e.textContent=label;e.onclick=fn;document.getElementById("board").appendChild(e)}
}
function updateScore(){document.getElementById("score").textContent=score}
showAll();
</script>
</body>
</html>
